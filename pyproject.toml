[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adamem-agent"
version = "0.1.0"
description = "Adaptive Memory Agent (AdaMEM) for long-horizon language-agent tasks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "AdaMEM authors"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "hnswlib>=0.8.0",
  "httpx>=0.27.0",
  "numpy>=1.24.0",
  "omegaconf>=2.3.0",
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "ray[default]>=2.41.0,<2.50.0",
  "requests>=2.31.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
  "transformers>=4.45.0,<5.0.0",
]

[project.optional-dependencies]
# Dependencies required by the text-only ALFWorld experiments in this repo.
alfworld = [
  "alfworld>=0.4.0",
  "gymnasium==0.29.1",
  "stable-baselines3==2.6.0",
  "torchvision>=0.17.0",
]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/yunx-z/AdaMEM"
Repository = "https://github.com/yunx-z/AdaMEM"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_system*", "examples*"]
namespaces = true

[tool.setuptools.package-data]
"agent_system.environments.env_package.alfworld" = ["configs/*.yaml"]
